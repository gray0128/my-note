[package]
name = "mynote-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mynote_cli"
path = "src/lib.rs"

[[bin]]
name = "mynote"
path = "src/main.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
blake3.workspace = true
clap.workspace = true
fs2.workspace = true
futures-util.workspace = true
getrandom.workspace = true
image.workspace = true
mime_guess.workspace = true
mynote-core = { path = "../mynote-core" }
mynote-store = { path = "../mynote-store" }
qrcode.workspace = true
reqwest.workspace = true
rmp-serde.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
url.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSEnumerator", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9"
