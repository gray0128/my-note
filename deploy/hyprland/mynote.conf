# my-note Hyprland keybinding & floating scratchpad window rules (Omarchy / Arch)
# Source this file from ~/.config/hypr/hyprland.conf:
#   source = ~/.config/hypr/mynote.conf
#
# Uses a fresh 10-second one-time auth ticket from `mynote open` so the Chromium
# app window exchanges it for an HttpOnly SameSite=Strict session cookie on
# `http://localhost:19876`.

$mynote_cmd = sh -c 'url="$(MYNOTE_NO_BROWSER=1 mynote open)"; exec chromium --app="$url" --class=my-note-webapp'

# Bind Super+Shift+N to open/summon my-note
bind = SUPER SHIFT, N, exec, $mynote_cmd

# Float and size the Chromium webapp window cleanly as a Heynote-style scratchpad
windowrulev2 = float, class:^(my-note-webapp)$
windowrulev2 = size 960 680, class:^(my-note-webapp)$
windowrulev2 = center, class:^(my-note-webapp)$
