name: Deploy Cloudflare Sync Relay

on:
  workflow_dispatch:
  push:
    tags:
      - "cloud-v*"

permissions:
  contents: read

concurrency:
  group: deploy-cloud-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify & Deploy cloud-cf Worker + Mobile Read-Only PWA (CI-only Scoped Token)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - uses: pnpm/action-setup@v4
        with:
          version: "12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build WASM, test web, and build Mobile Read-Only PWA static assets (web/dist-pwa)
        run: |
          ./scripts/build-wasm.sh
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web typecheck
          pnpm --dir web test
          pnpm --dir web build:pwa
      - name: Install cloud-cf dependencies
        run: pnpm --dir cloud-cf install --frozen-lockfile
      - name: Typecheck & run workerd contract tests before deploy
        run: pnpm --dir cloud-cf typecheck && pnpm --dir cloud-cf test
      - name: Deploy Worker & Mobile PWA assets via Scoped API Token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir cloud-cf exec wrangler deploy
