name: Release Desktop Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-web:
    name: Build Embedded Desktop Web UI (WASM + web/dist)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.resolve-tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: resolve-tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s\n' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "ERROR: release tag must match vX.Y.Z (got '$TAG')"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-tag.outputs.tag }}
      - name: Verify Cargo.toml version matches release tag
        shell: bash
        env:
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          CARGO_VER=$(grep -m1 '^version = "' Cargo.toml | sed -E 's/^version = "([^"]+)"/\1/')
          TAG_VER="${TAG#v}"
          if [ "$TAG_VER" != "$CARGO_VER" ]; then
            echo "ERROR: tag $TAG does not match Cargo.toml workspace version $CARGO_VER"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - uses: pnpm/action-setup@v4
        with:
          version: "12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build Desktop WASM & embedded web/dist
        run: |
          ./scripts/build-wasm.sh
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web typecheck
          pnpm --dir web test
          pnpm --dir web build
          test -s web/dist/index.html
      - name: Upload web-dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  build-release:
    name: Build & Verify (${{ matrix.target }})
    needs: [build-web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Preserve LF line endings on Windows checkout
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-web.outputs.tag }}
      - name: Download embedded Desktop Web UI assets
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build stripped release binary (mynote)
        if: runner.os != 'Windows'
        shell: bash
        run: cargo build --release --locked --bin mynote
      - name: Verify release binary against frozen CLI golden suite (G01-G11)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./target/release/mynote --version
          ./evals/golden/run_golden.sh --bin ./target/release/mynote
      - name: Package self-contained desktop bundle
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          STAGE="dist/mynote-${TARGET}"
          mkdir -p "$STAGE/skill" "$STAGE/deploy/launchd" "$STAGE/deploy/systemd" "$STAGE/deploy/hyprland" "$STAGE/deploy/ios-shortcuts"
          install -m 755 target/release/mynote "$STAGE/mynote"
          install -m 644 skill/SKILL.md "$STAGE/skill/SKILL.md"
          install -m 644 deploy/launchd/com.mynote.daemon.plist "$STAGE/deploy/launchd/com.mynote.daemon.plist"
          install -m 644 deploy/systemd/mynote-daemon.service "$STAGE/deploy/systemd/mynote-daemon.service"
          install -m 644 deploy/hyprland/mynote.conf "$STAGE/deploy/hyprland/mynote.conf"
          install -m 644 deploy/ios-shortcuts/mynote-clip-push.js "$STAGE/deploy/ios-shortcuts/mynote-clip-push.js"
          install -m 644 deploy/ios-shortcuts/README.md "$STAGE/deploy/ios-shortcuts/README.md"
          install -m 644 README.md "$STAGE/README.md"
          COPYFILE_DISABLE=1 tar -C dist -czf "dist/mynote-${TARGET}.tar.gz" "mynote-${TARGET}"
          ls -lh "dist/mynote-${TARGET}.tar.gz"
      - name: Upload release tarball
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: dist/mynote-${{ matrix.target }}.tar.gz
          retention-days: 1
      - name: Build stripped release binary (mynote.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked --bin mynote
          if ($LASTEXITCODE -ne 0) { throw "cargo build --release failed ($LASTEXITCODE)" }
          $exe = Get-Item -LiteralPath 'target/release/mynote.exe'
          Write-Host ("Built target/release/mynote.exe ({0} bytes / {1:N2} MiB)" -f $exe.Length, ($exe.Length / 1MB))
      - name: Verify release binary offline CLI JSON smoke check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandArgumentPassing = 'Standard'
          $bin = (Resolve-Path -LiteralPath 'target/release/mynote.exe').ProviderPath
          $ver = & $bin --version
          if ($LASTEXITCODE -ne 0) { throw "mynote.exe --version failed ($LASTEXITCODE)" }
          Write-Host "Verified version: $ver"

          $tmpData = Join-Path ([System.IO.Path]::GetTempPath()) ("mynote-rel-smoke-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $tmpData -Force | Out-Null
          $prevDataDir = $env:MYNOTE_DATA_DIR
          try {
            $env:MYNOTE_DATA_DIR = $tmpData

            $addRaw = & $bin add '{"b":1,"a":2}' --buf scratch --lang json --json
            if ($LASTEXITCODE -ne 0) { throw "mynote.exe add failed ($LASTEXITCODE)" }
            $addObj = $addRaw | ConvertFrom-Json
            if (-not $addObj.ok -or $addObj.meta.sync_state -ne 'pending_offline') {
              throw "Unexpected add JSON envelope: $addRaw"
            }
            $blockId = [string]$addObj.data.block_id
            $opId = [string]$addObj.data.op_id

            $lsRaw = & $bin ls --json
            if ($LASTEXITCODE -ne 0) { throw "mynote.exe ls --json failed ($LASTEXITCODE)" }
            $lsObj = $lsRaw | ConvertFrom-Json
            if (-not $lsObj.ok -or @($lsObj.data).Count -ne 1) {
              throw "Unexpected ls JSON envelope: $lsRaw"
            }

            $fmtRaw = & $bin format $blockId --expected-head $opId --json
            if ($LASTEXITCODE -ne 0) { throw "mynote.exe format failed ($LASTEXITCODE)" }
            $fmtObj = $fmtRaw | ConvertFrom-Json
            if (-not $fmtObj.ok) {
              throw "Unexpected format JSON envelope: $fmtRaw"
            }

            $rawText = (& $bin block get $blockId --raw) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "mynote.exe block get --raw failed ($LASTEXITCODE)" }
            if ($rawText -notmatch '"b":\s*1' -or $rawText -notmatch '"a":\s*2') {
              throw "Unexpected formatted block raw content: $rawText"
            }
            Write-Host "Windows offline CLI JSON smoke check PASS (block_id=$blockId)"
          } finally {
            $env:MYNOTE_DATA_DIR = $prevDataDir
            Remove-Item -LiteralPath $tmpData -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Package self-contained Windows desktop ZIP bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "dist/mynote-$($env:TARGET)"
          if (Test-Path -LiteralPath 'dist') {
            Remove-Item -LiteralPath 'dist' -Recurse -Force
          }
          New-Item -ItemType Directory -Path "$stage/skill", "$stage/deploy/windows", "$stage/deploy/ios-shortcuts" -Force | Out-Null
          Copy-Item -LiteralPath 'target/release/mynote.exe' -Destination "$stage/mynote.exe" -Force
          Copy-Item -LiteralPath 'skill/SKILL.md' -Destination "$stage/skill/SKILL.md" -Force
          Copy-Item -Path 'deploy/windows/*' -Destination "$stage/deploy/windows/" -Recurse -Force
          Copy-Item -Path 'deploy/ios-shortcuts/*' -Destination "$stage/deploy/ios-shortcuts/" -Recurse -Force
          Copy-Item -LiteralPath 'README.md' -Destination "$stage/README.md" -Force
          $zipPath = "dist/mynote-$($env:TARGET).zip"
          Compress-Archive -Path $stage -DestinationPath $zipPath -Force
          $zipItem = Get-Item -LiteralPath $zipPath
          Write-Host ("Packaged {0} ({1} bytes / {2:N2} MiB)" -f $zipItem.Name, $zipItem.Length, ($zipItem.Length / 1MB))
      - name: Upload Windows release zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: dist/mynote-${{ matrix.target }}.zip
          retention-days: 1
      - name: Build, verify & package optional macOS native Swift shell (MyNote.app)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.build-web.outputs.tag }}
        run: |
          TAG_VER="${TAG#v}"
          ./apps/macos/build.sh --version "$TAG_VER" --arch arm64 --out dist/macos-app
          MYNOTE_BIN=./target/release/mynote ./apps/macos/verify.sh --no-build --app dist/macos-app/MyNote.app
          ditto -c -k --sequesterRsrc --keepParent dist/macos-app/MyNote.app "dist/MyNote-${TARGET}.zip"
          ls -lh "dist/MyNote-${TARGET}.zip"
      - name: Upload macOS MyNote.app zip
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-macos-app-${{ matrix.target }}
          path: dist/MyNote-${{ matrix.target }}.zip
          retention-days: 1

  publish-release:
    name: Publish GitHub Release & SHA256SUMS
    needs: [build-web, build-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built release archives
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: release-assets
      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd release-assets
          ls -lh mynote-*.tar.gz mynote-*.zip MyNote-*.zip
          sha256sum mynote-*.tar.gz mynote-*.zip MyNote-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-web.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" release-assets/* \
              --repo "${{ github.repository }}" \
              --title "my-note ${TAG}" \
              --generate-notes
          fi
