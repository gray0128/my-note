name: Spike S-Win-1 (Windows Platform)

on:
  pull_request:
    paths:
      - "spikes/s-win-1-platform/**"
      - "docs/spikes/s-win-1-platform.md"
      - ".github/workflows/spike-win.yml"

permissions:
  contents: read

jobs:
  spike-win:
    name: S-Win-1 Windows Primitives (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/s-win-1-platform

      - name: Print Windows runner OS, CPU, and toolchain metadata
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "[S-Win-1][ENV] OS=$($os.Caption) Version=$($os.Version) Build=$($os.BuildNumber)"
          Write-Host "[S-Win-1][ENV] CPU=$($cpu.Name) Cores=$($cpu.NumberOfCores) LogicalProcessors=$($cpu.NumberOfLogicalProcessors)"
          Write-Host "[S-Win-1][ENV] User=$([Environment]::UserName) IsElevatedAdmin=$isAdmin"
          rustc -Vv
          cargo -V
          python --version

      - name: Check formatting
        run: cargo fmt --manifest-path spikes/s-win-1-platform/Cargo.toml --all -- --check

      - name: Clippy (strict -D warnings)
        run: cargo clippy --manifest-path spikes/s-win-1-platform/Cargo.toml --all-targets -- -D warnings

      - name: Run S-Win-1 integration & unit tests
        run: cargo test --manifest-path spikes/s-win-1-platform/Cargo.toml -- --nocapture

      - name: Measure Release binary size and tuned Release latencies
        shell: pwsh
        run: |
          cargo build --manifest-path spikes/s-win-1-platform/Cargo.toml --release
          $exe = Get-Item "spikes/s-win-1-platform/target/release/s-win-1-platform.exe"
          $kib = [math]::Round($exe.Length / 1024.0, 1)
          $mib = [math]::Round($exe.Length / 1048576.0, 2)
          Write-Host "[S-Win-1][SIZE] s-win-1-platform.exe (lto=thin, strip=true) = $($exe.Length) B ($kib KiB / $mib MiB)"
          & $exe.FullName --bench
