name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  immutable-verifier-guard:
    name: Enforce Immutable Verifier Rule (evals/)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check evals/ modification rules
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if printf '%s\n' "$PR_TITLE" | grep -q '^\[eval-only\]'; then
            DISALLOWED=$(printf '%s\n' "$CHANGED" | grep -vE '^(evals/|docs/eval-framework\.md$)' || true)
            if [ -n "$DISALLOWED" ]; then
              echo "ERROR: [eval-only] PR may only touch evals/ and docs/eval-framework.md:"
              echo "$DISALLOWED"
              exit 1
            fi
          else
            if printf '%s\n' "$CHANGED" | grep -q '^evals/'; then
              echo "ERROR: Feature/bugfix PR MUST NOT modify files inside evals/ (see evals/README.md)."
              exit 1
            fi
          fi

  rust-checks:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin evals/ to PR base commit on non-[eval-only] PRs
        if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, '[eval-only]')
        run: git checkout "${{ github.event.pull_request.base.sha }}" -- evals/
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      - name: Verify wasm32-unknown-unknown compilation
        run: cargo check -p mynote-core -p mynote-wasm --target wasm32-unknown-unknown
