name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  immutable-verifier-guard:
    name: Enforce Immutable Verifier Rule (evals/)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check evals/ modification rules
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          CHANGED=$(git -c core.quotePath=false diff --name-only "$BASE_SHA...$HEAD_SHA")
          if printf '%s\n' "$PR_TITLE" | grep -q '^\[eval-only\]'; then
            DISALLOWED=$(printf '%s\n' "$CHANGED" | grep -vE '^(evals/|docs/eval-framework\.md$)' || true)
            if [ -n "$DISALLOWED" ]; then
              echo "ERROR: [eval-only] PR may only touch evals/ and docs/eval-framework.md:"
              echo "$DISALLOWED"
              exit 1
            fi
          else
            if printf '%s\n' "$CHANGED" | grep -q '^evals/'; then
              echo "ERROR: Feature/bugfix PR MUST NOT modify files inside evals/ (see evals/README.md)."
              exit 1
            fi
          fi

  web-checks:
    name: Web UI (TypeScript + Vite + Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin evals/ to PR base commit on non-[eval-only] PRs
        if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, '[eval-only]')
        run: rm -rf evals/ && git checkout "${{ github.event.pull_request.base.sha }}" -- evals/
      - uses: pnpm/action-setup@v4
        with:
          version: "12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Typecheck web UI
        run: pnpm --dir web typecheck
      - name: Test web UI
        run: pnpm --dir web test
      - name: Build web UI
        run: pnpm --dir web build

  cloud-cf-checks:
    name: Cloudflare Relay (workerd contract + shared scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin evals/ to PR base commit on non-[eval-only] PRs
        if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, '[eval-only]')
        run: rm -rf evals/ && git checkout "${{ github.event.pull_request.base.sha }}" -- evals/
      - uses: pnpm/action-setup@v4
        with:
          version: "12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: cloud-cf/pnpm-lock.yaml
      - name: Install cloud-cf dependencies
        run: pnpm --dir cloud-cf install --frozen-lockfile
      - name: Enforce M1 LOC budget (< 500 lines in cloud-cf/src/)
        shell: bash
        run: |
          LOC=$(find cloud-cf/src -type f \( -name '*.ts' -o -name '*.mts' -o -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 cat | wc -l | awk '{print $1}')
          echo "cloud-cf/src total lines = ${LOC}"
          if [ "$LOC" -ge 500 ]; then
            echo "ERROR: cloud-cf/src/ exceeded M1 < 500 LOC target ($LOC lines)"
            exit 1
          fi
      - name: Typecheck cloud-cf
        run: pnpm --dir cloud-cf typecheck
      - name: Run workerd contract & shared scenario tests
        run: pnpm --dir cloud-cf test

  rust-checks:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin evals/ to PR base commit on non-[eval-only] PRs
        if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, '[eval-only]')
        run: rm -rf evals/ && git checkout "${{ github.event.pull_request.base.sha }}" -- evals/
      - uses: pnpm/action-setup@v4
        with:
          version: "12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build embedded web UI assets
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace (including 500-seed DST + INV-RECOVERY + SEC-05)
        env:
          MYNOTE_DST_SEEDS: "500"
        run: cargo test --workspace
      - name: Verify wasm32-unknown-unknown compilation
        run: cargo check -p mynote-core -p mynote-wasm --target wasm32-unknown-unknown
