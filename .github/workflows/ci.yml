name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  immutable-verifier-guard:
    name: Enforce Immutable Verifier Rule (evals/)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check evals/ modification rules
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          CHANGED=$(git -c core.quotePath=false diff --name-only "$BASE_SHA...$HEAD_SHA")
          if printf '%s\n' "$PR_TITLE" | grep -q '^\[eval-only\]'; then
            DISALLOWED=$(printf '%s\n' "$CHANGED" | grep -vE '^(evals/|docs/eval-framework\.md$)' || true)
            if [ -n "$DISALLOWED" ]; then
              echo "ERROR: [eval-only] PR may only touch evals/ and docs/eval-framework.md:"
              echo "$DISALLOWED"
              exit 1
            fi
          else
            if printf '%s\n' "$CHANGED" | grep -q '^evals/'; then
              echo "ERROR: Feature/bugfix PR MUST NOT modify files inside evals/ (see evals/README.md)."
              exit 1
            fi
          fi

  web-checks:
    name: WASM + Desktop Web UI + Mobile Read-Only PWA
    needs: [immutable-verifier-guard]
    if: always() && (github.event_name != 'pull_request' || needs.immutable-verifier-guard.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin evals/ to PR base commit on non-[eval-only] PRs
        if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, '[eval-only]')
        run: rm -rf evals/ && git checkout "${{ github.event.pull_request.base.sha }}" -- evals/
      - name: Run Tier 0 static architecture & budget guard (with mutant selftest)
        run: |
          python3 scripts/check-architecture.py --selftest
          python3 scripts/check-architecture.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - uses: pnpm/action-setup@v4
        with:
          version: "12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build Desktop & PWA WASM packages (with instantiation smoke check)
        run: ./scripts/build-wasm.sh
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Typecheck web UI & Mobile PWA
        run: pnpm --dir web typecheck
      - name: Test web UI (including real WASM M2 Vault & SEC-03 unit audit)
        run: pnpm --dir web test
      - name: Build Desktop Web UI (web/dist) and Mobile Read-Only PWA (web/dist-pwa)
        run: pnpm --dir web build && pnpm --dir web build:pwa
      - name: Upload Desktop Web UI dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
      - name: Upload Mobile Read-Only PWA dist-pwa artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-pwa
          path: web/dist-pwa
          retention-days: 1

  cloud-cf-checks:
    name: Cloudflare Relay (workerd contract + shared scenarios + PWA CSP)
    needs: [web-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin evals/ to PR base commit on non-[eval-only] PRs
        if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, '[eval-only]')
        run: rm -rf evals/ && git checkout "${{ github.event.pull_request.base.sha }}" -- evals/
      - name: Download Mobile Read-Only PWA assets
        uses: actions/download-artifact@v4
        with:
          name: web-dist-pwa
          path: web/dist-pwa
      - uses: pnpm/action-setup@v4
        with:
          version: "12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: cloud-cf/pnpm-lock.yaml
      - name: Install cloud-cf dependencies
        run: pnpm --dir cloud-cf install --frozen-lockfile
      - name: Enforce M2 LOC budget (<= 700 lines in cloud-cf/src/)
        shell: bash
        run: |
          LOC=$(find cloud-cf/src -type f \( -name '*.ts' -o -name '*.mts' -o -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 cat | wc -l | awk '{print $1}')
          echo "cloud-cf/src total lines = ${LOC}"
          if [ "$LOC" -gt 700 ]; then
            echo "ERROR: cloud-cf/src/ exceeded M2 <= 700 LOC target ($LOC lines)"
            exit 1
          fi
      - name: Typecheck cloud-cf
        run: pnpm --dir cloud-cf typecheck
      - name: Run workerd contract & shared scenario tests
        run: pnpm --dir cloud-cf test

  rust-checks:
    name: Rust (${{ matrix.os }})
    needs: [web-checks]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin evals/ to PR base commit on non-[eval-only] PRs
        if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, '[eval-only]')
        run: rm -rf evals/ && git checkout "${{ github.event.pull_request.base.sha }}" -- evals/
      - name: Download embedded Desktop Web UI assets
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace (including 500-seed M1/M2 DST + INV-RECOVERY + INV-SHRED-BOUND + SEC-01/04/05)
        env:
          MYNOTE_DST_SEEDS: "500"
        run: cargo test --workspace
      - name: Run frozen CLI golden tests (evals/golden/ G01-G11 + static checks)
        run: |
          cargo build --bin mynote
          ./evals/golden/run_golden.sh
      - name: Verify wasm32-unknown-unknown compilation (core + desktop & pwa WASM features)
        run: |
          cargo check -p mynote-core --target wasm32-unknown-unknown
          cargo check -p mynote-wasm --target wasm32-unknown-unknown --no-default-features --features desktop
          cargo check -p mynote-wasm --target wasm32-unknown-unknown --no-default-features --features pwa

  m2-e2e-security:
    name: M2 & M3 Security & Render Audits (PTY Vault + Chromium/WebKit SEC-03/06/08 + Pele + History)
    needs: [web-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin evals/ to PR base commit on non-[eval-only] PRs
        if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, '[eval-only]')
        run: rm -rf evals/ && git checkout "${{ github.event.pull_request.base.sha }}" -- evals/
      - name: Download embedded Desktop Web UI & Mobile PWA assets
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-pwa
          path: web/dist-pwa
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build mynote binary
        run: cargo build --bin mynote
      - uses: pnpm/action-setup@v4
        with:
          version: "12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: cloud-cf/pnpm-lock.yaml
      - name: Install cloud-cf dependencies (for local wrangler dev)
        run: pnpm --dir cloud-cf install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright (Chromium & WebKit)
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium webkit
      - name: Run CLI PTY Vault & Shred Guard E2E
        run: python3 tests/e2e/test_m2_cli_pty_vault_shred.py
      - name: Run SEC-03 Desktop Daemon + Chromium WASM Audit
        run: python3 tests/e2e/test_m2_sec03_desktop_chromium.py
      - name: Run SEC-08 Mobile Read-Only PWA + wrangler dev + WebKit Audit
        run: python3 tests/e2e/test_m2_sec08_mobile_webkit.py
      - name: Run M3 SEC-06 / Pele Copy PNG (Chromium & WebKit) / Time Travel E2E
        run: python3 tests/e2e/test_m3_sec06_pele_history.py
      - name: Run UI CDP Viewport Geometry, Console Error & SQLite Equivalence Gate
        run: python3 tests/e2e/test_ui_cdp_equivalence.py
