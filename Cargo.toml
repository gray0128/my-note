[workspace]
resolver = "2"
members = [
    "crates/mynote-core",
    "crates/mynote-wasm",
    "crates/mynote-store",
    "crates/mynote-cli",
]
exclude = [
    "spikes/s0-2-macos-tauri-spike/shell-app",
    "spikes/s0-3-wasm-argon2",
    "spikes/s-clip-1-ios-shortcuts/rust-interop",
    "spikes/s-clip-3-macos-pasteboard",
    "spikes/s-clip-4-hyprland-wayland",
    "spikes/s-plugin-1-wasmi",
    "spikes/s-plugin-1-wasmi/guest-calc",
    "spikes/s-win-1-platform",
]

[workspace.package]
version = "0.3.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22.1"
bip39 = { version = "3.0.0", default-features = false, features = ["std"] }
blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.10", features = ["derive", "wrap_help"] }
fs2 = "0.4"
futures-util = "0.3"
getrandom = "0.4"
hkdf = "0.13.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff"] }
json5 = "1.3.8"
mime_guess = "2.0"
proptest = "1.12.0"
qrcode = { version = "0.14", default-features = false }
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmp-serde = "1.3.1"
roxmltree = "0.21.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rust-embed = "8.5"
ruzstd = { version = "0.9.1", default-features = false, features = ["std", "hash"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10.0"
sha2 = { version = "0.11.1", default-features = false }
sqlformat = "0.5.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
unicode-width = "0.2.3"
url = "2.5.9"
form_urlencoded = "1.2"
uuid = { version = "1.29.3", default-features = false, features = ["serde"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9.2", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = false

