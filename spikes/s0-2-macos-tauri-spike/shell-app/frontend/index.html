<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>my-note S0-2 Hotkey Latency Probe</title>
  <style>
    body { font-family: -apple-system, monospace; margin: 16px; background: #141414; color: #f5f5f5; }
    textarea { width: 100%; height: 220px; background: #222; color: #fff; border: 1px solid #444; padding: 10px; font-size: 14px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; background: #1e3a8a; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="badge" id="auth">COOKIE_AUTH: checking...</div>
  <div class="badge" id="origin"></div>
  <textarea id="editor" placeholder="Press Cmd+Shift+M from another app; Esc to hide"></textarea>
  <script>
    const editor = document.getElementById("editor");
    document.getElementById("origin").textContent = "ORIGIN: " + location.origin;

    fetch("/v1/local/ping", { method: "POST", credentials: "same-origin" })
      .then((r) => r.json())
      .then((j) => {
        document.getElementById("auth").textContent = "COOKIE_AUTH: " + (j.cookie_auth ? "OK (SameSite=Strict)" : "FAILED");
      })
      .catch((e) => {
        document.getElementById("auth").textContent = "COOKIE_AUTH: ERR (" + e.message + ")";
      });

    if (window.__TAURI__) {
      window.__TAURI__.event.listen("spike://hotkey-pressed", (ev) => {
        const [t0, tVis] = ev.payload;
        editor.focus();
        requestAnimationFrame(() => {
          window.__TAURI__.core.invoke("record_focus_latency", { hotkeyMs: t0, visibleMs: tVis });
        });
      });
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") window.__TAURI__.core.invoke("hide_window");
      });
    }
  </script>
</body>
</html>
