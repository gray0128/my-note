[package]
name = "mynote-s-plugin-1-wasmi"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasmi = { version = "2.0.3", default-features = false, features = ["std", "validate", "portable-dispatch"] }

[profile.release]
lto = "thin"
strip = true
